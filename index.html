<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="未来的我">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf5ef">
<title>未来的我</title>
<style>
  :root{
    --bg:#faf5ef; --card:#fffdfa; --ink:#3b2f2a; --soft:#9a8a80;
    --rose:#c9736b; --rose-dark:#a8564f; --line:#eadfd4; --gold:#c9a15a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:480px;margin:0 auto;padding:26px 18px 50px}
  h1{font-family:"Songti SC","SimSun",serif;font-size:30px;margin:0;letter-spacing:4px;text-align:center}
  .sub{text-align:center;color:var(--soft);font-size:14px;margin:4px 0 18px}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

  .frame{position:relative;border-radius:22px;overflow:hidden;background:#e9ddd1;
    box-shadow:0 14px 36px rgba(120,80,60,.2)}
  .frame canvas{display:block;width:100%;height:auto}
  .frame .pct{position:absolute;top:12px;right:12px;padding:3px 12px;border-radius:999px;font-size:13px;
    color:#fff;background:rgba(60,40,30,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .frame .flash{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 18px;text-align:center;color:#fff;
    font-family:"Songti SC","SimSun",serif;font-size:19px;letter-spacing:3px;
    background:linear-gradient(transparent,rgba(60,40,30,.65));opacity:0;transition:opacity 1s ease}
  .frame.flashing .flash{opacity:1}
  .frame.flashing{animation:glow 4s ease}
  @keyframes glow{0%{box-shadow:0 0 0 0 rgba(201,161,90,.95)}40%{box-shadow:0 0 0 20px rgba(201,161,90,0)}100%{box-shadow:0 14px 36px rgba(120,80,60,.2)}}

  /* 框身体 */
  .tip{font-size:14px;margin:0 0 12px}
  .box{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(40,25,20,.4);border-radius:6px}
  .h{position:absolute;width:38px;height:38px;border-radius:50%;background:#fff;border:4px solid var(--rose);
    touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .h.tl{left:-19px;top:-19px}
  .h.br{right:-19px;bottom:-19px}

  .bar{margin:18px 4px 6px}
  .bar .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--soft)}
  .track{position:relative;height:8px;border-radius:999px;background:#ebe0d5;margin-top:6px}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;
    background:linear-gradient(90deg,#e0b9a8,var(--rose));transition:width 1.4s ease}
  .knob{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--rose);
    transform:translate(-50%,-50%);transition:left 1.4s ease;box-shadow:0 2px 6px rgba(120,80,60,.25)}
  .hint{text-align:center;font-size:14px;margin:12px 0 16px;min-height:22px}
  .hint.warn{color:#b34a3f}
  .hint.good{color:var(--gold)}

  .main-btn{display:block;width:100%;padding:16px;border-radius:999px;background:var(--rose);color:#fff;
    font-size:18px;letter-spacing:2px;box-shadow:0 6px 16px rgba(201,115,107,.35);margin-top:12px}
  .main-btn:active{background:var(--rose-dark);transform:translateY(1px)}
  .main-btn.done{background:#e6dcd2;color:var(--soft);box-shadow:none}
  .main-btn.second{background:#f0e7de;color:var(--ink);box-shadow:none}
  .link{display:block;margin:10px auto 0;font-size:13px;color:var(--soft);text-decoration:underline}

  .days{display:flex;justify-content:space-between;margin:26px 2px 0}
  .day{width:16px;text-align:center;font-size:10px;color:var(--soft)}
  .day i{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 3px;background:#eadfd4}
  .day.on i{background:var(--rose)}
  .day.today i{outline:2px solid var(--gold);outline-offset:2px}

  .empty{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center}
  .empty p{margin:0 0 10px;font-size:15px}
  .empty .small{color:var(--soft);font-size:13px;text-align:left}

  dialog{border:none;border-radius:20px;padding:22px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(50,35,28,.55)}
  dialog h3{margin:0 0 6px;font-family:"Songti SC","SimSun",serif;font-size:19px;text-align:center}
  label{display:block;font-size:13px;color:var(--soft);margin:14px 0 4px}
  input[type=file],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
  .row{display:flex;gap:10px;margin-top:20px}
  .row button{flex:1;padding:12px;border-radius:999px}
  .ok{background:var(--rose);color:#fff}
  .ghost{background:#f0e7de}
  .note{font-size:12px;color:var(--soft);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>未来的我</h1>
  <div class="sub">每练一次，照片里的你就瘦一点</div>
  <div id="app"></div>
</div>

<dialog id="dlg">
  <h3 id="dTitle">开始</h3>
  <label>现在的我（一张全身照）</label>
  <input type="file" id="fNow" accept="image/*">
  <label>最后想瘦多少</label>
  <select id="fAmount">
    <option value="0.14">瘦一点点</option>
    <option value="0.24" selected>瘦一圈</option>
    <option value="0.34">瘦很多</option>
  </select>
  <label>一共练多少次瘦到位</label>
  <select id="fTarget">
    <option value="20">20 次</option>
    <option value="30" selected>30 次</option>
    <option value="45">45 次</option>
    <option value="60">60 次</option>
  </select>
  <div class="note" id="dNote"></div>
  <div class="row">
    <button class="ghost" id="dCancel">取消</button>
    <button class="ok" id="dOk">下一步</button>
  </div>
</dialog>

<script>
let state = null;       // {now, box:{x0,y0,x1,y1}, amount, target, log:[], doneAt}
let draft = null;       // 设置到一半的东西
let view = 'main';      // main | adjust
let preview = false;
let busy = false;
let src = null, out = null;   // 原图像素、输出缓冲
const $ = id => document.getElementById(id);
const DEFAULT_BOX = {x0:0.2, y0:0.2, x1:0.8, y1:0.95};

/* ---------- 存储 ---------- */
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('future-me', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function load(){
  const db = await idb();
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get('slim');
    q.onsuccess = () => res(q.result || null);
    q.onerror = () => rej(q.error);
  });
}
async function save(){
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(state, 'slim');
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

/* ---------- 工具 ---------- */
function dayStr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const today = () => dayStr(new Date());
function parseDay(s){ const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

function loadImg(url){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('图片读不出来'));
    img.src = url;
  });
}
function readImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = async () => {
      try{
        const img = await loadImg(fr.result);
        const k = Math.min(1, 1000 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.88));
      }catch(e){ rej(e); }
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- 把照片变瘦 ---------- */
async function prepare(url){
  const img = await loadImg(url);
  const cv = document.createElement('canvas');
  cv.width = img.width; cv.height = img.height;
  const ctx = cv.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(img, 0, 0);
  src = {w: cv.width, h: cv.height, px: ctx.getImageData(0, 0, cv.width, cv.height).data};
  out = null;
}
const ss = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };

/* strength 0 = 原图，1 = 最瘦。框内中间往中线收，框的四条边不动。 */
function draw(cv, strength, box, amount){
  if (!src || !cv) return;
  const w = src.w, h = src.h;
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  const ctx = cv.getContext('2d');
  if (!out || out.width !== w || out.height !== h) out = ctx.createImageData(w, h);
  const s = src.px, d = out.data;
  d.set(s);
  const X0 = Math.round(box.x0 * w), X1 = Math.round(box.x1 * w);
  const Y0 = Math.round(box.y0 * h), Y1 = Math.round(box.y1 * h);
  const cx = (X0 + X1) / 2, hw = (X1 - X0) / 2, bh = Y1 - Y0;
  if (strength > 0 && hw > 2 && bh > 2){
    for (let y = Y0; y < Y1; y++){
      const t = (y - Y0) / bh;
      const A = amount * strength * ss(t / 0.2) * ss((1 - t) / 0.2);
      if (A < 0.001) continue;
      const row = y * w * 4;
      for (let x = X0; x < X1; x++){
        const u = (x + 0.5 - cx) / hw;
        const k = 1 - u * u;
        let sx = cx + u * (1 + A * k) * hw - 0.5;
        if (sx < 0) sx = 0; else if (sx > w - 1) sx = w - 1;
        const i0 = sx | 0, f = sx - i0, i1 = i0 + 1 < w ? i0 + 1 : i0;
        const a = row + i0 * 4, b = row + i1 * 4, o = row + x * 4;
        d[o]   = s[a]   + (s[b]   - s[a])   * f;
        d[o+1] = s[a+1] + (s[b+1] - s[a+1]) * f;
        d[o+2] = s[a+2] + (s[b+2] - s[a+2]) * f;
      }
    }
  }
  ctx.putImageData(out, 0, 0);
}
function animate(from, to, ms){
  return new Promise(res => {
    const t0 = performance.now();
    (function step(now){
      let k = clamp((now - t0) / ms, 0, 1);
      k = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      draw($('cv'), from + (to - from) * k, state.box, state.amount);
      if (k < 1) requestAnimationFrame(step); else res();
    })(t0);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* 从打卡记录算出现在瘦到哪了：
   练一天 +1；连着歇到第 3 天起，每天 -0.5；今天还没过完，不算歇。 */
function calc(){
  const set = new Set(state.log);
  const t = today();
  if (!set.size) return {pts:0, gap:0};
  const d = parseDay([...set].sort()[0]);
  let pts = 0, gap = 0;
  for (;;){
    const s = dayStr(d);
    if (s > t) break;
    if (set.has(s)){ pts = Math.min(state.target, pts + 1); gap = 0; }
    else if (s < t){ gap++; if (gap >= 3) pts = Math.max(0, pts - 0.5); }
    d.setDate(d.getDate() + 1);
  }
  return {pts, gap};
}
const ratio = () => state.doneAt ? 1 : Math.min(1, calc().pts / state.target);

/* ---------- 画面 ---------- */
function render(){
  if (view === 'adjust') return renderAdjust();
  if (!state){
    $('app').innerHTML = `<div class="empty">
      <p>拍一张现在的全身照放进来。之后每练一次，照片里的你就瘦一点。</p>
      <div class="small">
        📷 正面站直，手臂稍微离开身体<br>
        🧱 背景越简单越好，白墙最好<br>
        👗 穿贴身一点的衣服，变化看得更清楚
      </div>
      <button class="main-btn" style="margin-top:18px" onclick="openDlg('new')">开始</button>
    </div>`;
    return;
  }
  const {pts, gap} = calc();
  const p = ratio();
  const pct = Math.round(p * 100);
  const did = state.log.includes(today());
  const left = Math.ceil(state.target - pts);

  let hint = '', cls = '';
  if (state.doneAt){ hint = '你已经瘦到位了。去拍一张现在的你，开始下一轮。'; cls = 'good'; }
  else if (!state.log.length) hint = '练完第一次，回来点下面的按钮。';
  else if (!did && gap >= 3){ hint = `已经 ${gap} 天没练，照片里的你正在胖回去。今天练一次就停住。`; cls = 'warn'; }
  else if (!did && gap === 2){ hint = '已经 2 天没练。明天再不练，就要开始胖回去了。'; cls = 'warn'; }
  else hint = `再练 ${left} 次，就瘦到位。`;

  let h = `<div class="frame" id="frame">
      <canvas id="cv"></canvas>
      <div class="pct" id="pct">已经瘦了 ${pct}%</div>
      <div class="flash">这就是你要去的地方</div>
    </div>
    <div class="bar">
      <div class="ends"><span>现在的我</span><span>未来的我</span></div>
      <div class="track"><div class="fill" id="fill" style="width:${pct}%"></div><div class="knob" id="knob" style="left:${pct}%"></div></div>
    </div>
    <div class="hint ${cls}" id="hint">${hint}</div>`;

  if (state.doneAt) h += `<button class="main-btn" onclick="openDlg('next')">开始下一轮</button>`;
  else h += did
      ? `<button class="main-btn done" disabled>今天已经瘦过一点了，明天见</button>
         <button class="link" onclick="undo()">点错了，撤销</button>`
      : `<button class="main-btn" onclick="checkIn()">今天练了</button>`;

  h += '<div class="days">';
  const d = new Date(); d.setDate(d.getDate() - 13);
  for (let i = 0; i < 14; i++){
    const s = dayStr(d);
    h += `<div class="day${state.log.includes(s) ? ' on' : ''}${i === 13 ? ' today' : ''}"><i></i>${d.getDate()}</div>`;
    d.setDate(d.getDate() + 1);
  }
  h += '</div>';
  if (!state.doneAt) h += `<button class="link" style="margin-top:22px" onclick="openDlg('edit')">换照片 / 重新框身体</button>`;
  $('app').innerHTML = h;
  draw($('cv'), p, state.box, state.amount);
}

/* ---------- 打卡 ---------- */
async function checkIn(){
  if (busy || state.log.includes(today())) return;
  busy = true;
  const from = ratio();
  state.log.push(today());
  if (calc().pts >= state.target) state.doneAt = today();
  await save();
  const to = ratio(), pct = Math.round(to * 100);

  // 先变成最瘦的样子，停一下，再退回到新的位置
  $('frame').classList.add('flashing');
  $('pct').textContent = '未来的你';
  await animate(from, 1, 1500);
  await wait(2000);
  $('frame').classList.remove('flashing');
  $('fill').style.width = pct + '%';
  $('knob').style.left = pct + '%';
  $('pct').textContent = `已经瘦了 ${pct}%`;
  if (to < 1) await animate(1, to, 1500);
  busy = false;
  render();
}

async function undo(){
  if (busy) return;
  const t = today();
  state.log = state.log.filter(x => x !== t);
  if (state.doneAt === t) state.doneAt = null;
  await save();
  render();
}

/* ---------- 设置第一步：选照片 ---------- */
function openDlg(mode){
  $('fNow').value = '';
  $('fTarget').value = String(state && mode === 'edit' ? state.target : 30);
  $('fAmount').value = String(state && mode === 'edit' ? state.amount : 0.24);
  $('dTitle').textContent = mode === 'edit' ? '换照片 / 重新框身体' : (mode === 'next' ? '开始下一轮' : '开始');
  $('dNote').textContent = mode === 'edit' ? '不换照片就留空，进度不会丢。'
    : (mode === 'next' ? '放一张现在的你，从 0 重新开始。' : '');
  $('dlg').dataset.mode = mode;
  $('dlg').showModal();
}
$('dCancel').onclick = () => $('dlg').close();
$('dOk').onclick = async () => {
  const mode = $('dlg').dataset.mode;
  const f = $('fNow').files[0];
  if (!f && mode !== 'edit'){ alert('先选一张照片'); return; }
  try{
    const now = f ? await readImage(f) : state.now;
    draft = {
      mode, now,
      box: (!f && state) ? {...state.box} : {...DEFAULT_BOX},
      amount: +$('fAmount').value, target: +$('fTarget').value
    };
    await prepare(now);
    $('dlg').close();
    view = 'adjust'; preview = false;
    render();
  }catch(e){ alert('照片没读进来：' + e.message); }
};

/* ---------- 设置第二步：框身体 ---------- */
function renderAdjust(){
  $('app').innerHTML = `
    <p class="tip">拖两个圆点，把框拉到：<b>上边到肩膀，下边到脚踝，左右比身体各宽出一截</b>。脸不要框进去。</p>
    <div class="frame" id="adj">
      <canvas id="cv"></canvas>
      <div class="box" id="box"><b class="h tl" data-h="tl"></b><b class="h br" data-h="br"></b></div>
    </div>
    <button class="main-btn second" id="pv">看看瘦完的样子</button>
    <button class="main-btn" onclick="confirmAdjust()">就这样，开始</button>
    <button class="link" onclick="cancelAdjust()">取消</button>`;
  placeBox();
  draw($('cv'), 0, draft.box, draft.amount);
  $('pv').onclick = () => {
    preview = !preview;
    $('box').style.display = preview ? 'none' : '';
    $('pv').textContent = preview ? '回到原图，继续调框' : '看看瘦完的样子';
    draw($('cv'), preview ? 1 : 0, draft.box, draft.amount);
  };
  document.querySelectorAll('.h').forEach(el => {
    el.onpointerdown = e => { el.setPointerCapture(e.pointerId); e.preventDefault(); };
    el.onpointermove = e => {
      if (!el.hasPointerCapture(e.pointerId)) return;
      const r = $('adj').getBoundingClientRect();
      const nx = clamp((e.clientX - r.left) / r.width, 0.02, 0.98);
      const ny = clamp((e.clientY - r.top) / r.height, 0.02, 0.98);
      const b = draft.box;
      if (el.dataset.h === 'tl'){ b.x0 = Math.min(nx, b.x1 - 0.15); b.y0 = Math.min(ny, b.y1 - 0.15); }
      else { b.x1 = Math.max(nx, b.x0 + 0.15); b.y1 = Math.max(ny, b.y0 + 0.15); }
      placeBox();
    };
  });
}
function placeBox(){
  const b = draft.box, el = $('box');
  el.style.left = (b.x0 * 100) + '%';
  el.style.top = (b.y0 * 100) + '%';
  el.style.width = ((b.x1 - b.x0) * 100) + '%';
  el.style.height = ((b.y1 - b.y0) * 100) + '%';
}
async function confirmAdjust(){
  const keep = draft.mode === 'edit' && state;
  state = {
    now: draft.now, box: draft.box, amount: draft.amount, target: draft.target,
    log: keep ? state.log : [], doneAt: null
  };
  if (keep && calc().pts >= state.target) state.doneAt = today();
  await save();
  draft = null; view = 'main';
  render();
}
async function cancelAdjust(){
  draft = null; view = 'main';
  if (state) await prepare(state.now); else src = null;
  render();
}

load().then(async s => { state = s; if (state) await prepare(state.now); render(); })
      .catch(() => { $('app').innerHTML = '<div class="empty"><p>这个浏览器存不了数据，换 Chrome 或 Safari 打开试试。</p></div>'; });
</script>
</body>
</html>
